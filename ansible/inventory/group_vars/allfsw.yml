# group_vars/fsw.yml
# mgmt_interface: port1
mgmt_subnet: 255.255.255.0
mgmt_gateway: 192.168.5.1
ansible_user: admin
admin_password_file: ../fsw_admin_password.txt

bgp:
  as: 65001
  redistribute:
    - name: connected
      status: enable
  neighbor_group:
    - name: ISL
      advertisement_interval: 0
      activate_evpn: enable
      bfd: enable
      capability_extended_nexthop: enable
      soft_reconfiguration: enable
      remote_as: "internal"
      keep_alive_timer: 3
      holdtime_timer: 9
      password: "fortinet"
  spine_config:
    ### Spine Configs:
    route_reflector_client: enable
    route_reflector_client_evpn: enable

ssh_admin_name: ssh_admin
ssh_admin_profile: super_admin
ssh_pubkey: "'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID604VTVJnkyLJcPW/0N841KlFl3S1lPh937+Wn/aW7K mike@devtools'"
ssh_pubkey_path: "~/.ssh/id_ed25519.pub"
ssh_privkey_path: "~/.ssh/id_ed25519"
ssh_options_list: "StrictHostKeyChecking=no  UserKnownHostsFile=/dev/null"
