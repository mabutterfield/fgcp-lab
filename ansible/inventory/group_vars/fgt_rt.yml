vdoms:
  - name: root
    mgmt: true
  - name: traffic
### We use FGSP Index to calculate IP address, quick and easy way to do this for RT

networks:
  dc_lan: "10.10.10.0/24"
  prem_lan: "10.10.20.0/24"
  sync1: "10.10.30.0/24"
  sync2: "10.10.40.0/24"
  dc_fts: "10.100.0.0/24"
  prem_fts: "10.200.0.0/24"
  loopback: "10.10.255.0/32"

# aggregate:
#   - name: "agg"
#     members: ["port2", "port3"]
#     lacp: "active"
#     vdom: root

bgp:
  vdom: "data"
  local_as: 65020

  # Peers computed from FGSP transit /28 addresses (see tasks/bgp.yml)

firewall_policy:
  - policyid: 20
    state: "present"
    name: "Prem-to-DC"
    comments: "Ansible Managed FW Policy"
    status: "enable"
    ### FW Matching
    srcintf:
      - name: "to_prem"
    srcaddr:
      - name: "rfc-net"
    dstintf:
      - name: "to_dc"
    dstaddr:
      - name: "rfc-net"
    action: "accept"
    service:
      - name: "ALL"
    logtraffic: "all"
    ### Security Profiles
    utm_status: "disable"
    # ssl_ssh_profile: "certificate-inspection"
    # ips_sensor: "g-default"
    # application_list: "g-default"
  - policyid: 30
    state: "present"
    name: "DC-to-Prem"
    comments: "Ansible Managed FW Policy"
    status: "enable"
    ### FW Matching
    srcintf:
      - name: "to_dc"
    srcaddr:
      - name: "rfc-net"
    dstintf:
      - name: "to_prem"
    dstaddr:
      - name: "rfc-net"
    action: "accept"
    service:
      - name: "ALL"
    logtraffic: "all"
    ### Security Profiles
    utm_status: "disable"
    # ssl_ssh_profile: "certificate-inspection"
    # ips_sensor: "g-default"
    # application_list: "g-default"
