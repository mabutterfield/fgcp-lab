# inventory.yml
all:
  children:
    local:
      hosts:
        localhost: { ansible_connection: localhost }
    fgsp:
      hosts:
        fgsp_fgt1: { ansible_host: 10.255.113.101, fgsp_index: 1 }
        fgsp_fgt2: { ansible_host: 10.255.113.102, fgsp_index: 2 }
        fgsp_fgt3: { ansible_host: 10.255.113.103, fgsp_index: 3 }
        fgsp_fgt4: { ansible_host: 10.255.113.104, fgsp_index: 4 }
    routers:
      hosts:
        fgt-rt1: { ansible_host: 10.255.113.111 }
        fgt-rt2: { ansible_host: 10.255.113.112 }
    allfgt:
      children:
        fgsp:
        routers:
      vars:
        ansible_connection: httpapi
        ansible_network_os: fortinet.fortios.fortios
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
        ansible_httpapi_port: 443
