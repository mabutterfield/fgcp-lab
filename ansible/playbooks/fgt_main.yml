---
- name: FortiGate System Configuration
  hosts: allfgt
  connection: httpapi
  gather_facts: false
  pre_tasks:
    - name: Establish Paths
      ansible.builtin.include_tasks:
        file: "includes/pre_tasks.yml"
      tags: [always]
  tasks:
    - name: System Configuration
      ansible.builtin.include_tasks: "includes/fgt_system.yml"

    - name: Enable VDOM
      ansible.builtin.include_tasks: "includes/vdom.yml"

    - name: Configure Interfaces
      ansible.builtin.include_tasks: "includes/interface.yml"

    - name: Configure FGSP
      ansible.builtin.include_tasks: "includes/fgsp.yml"
      when: "'fgsp' in group_names"


    - name: Configure BGP
      ansible.builtin.include_tasks: "includes/bgp.yml"
      tags: [bgp]
      # when: "'fgsp' in group_names"

    - name: Configure FW Policy
      ansible.builtin.include_tasks: "includes/policy.yml"
