- name: Select Traffic Interfaces
  ansible.builtin.set_fact:
    traffic_int: "{{ interfaces | selectattr('vdom','defined') | selectattr('vdom','ne','root')| map(attribute='name') | list }}"

# - name: Debug BGP peers
#   ansible.builtin.debug:
#     var: interfaces | rejectattr('vdom','equalto','root') | list

- name: Select Peers for Traffic (last 2 IPs of subnet)
  ansible.builtin.set_fact:
    bgp_peer: "{{ bgp_peer | default([]) + [{
      'vdom': item.vdom,
      'interface': item.name,
      'ip': (networks[item.network] | ansible.utils.ipmath(fgsp_index) ),
      'bgp_peer': (networks[item.network] | ansible.utils.ipmath(-2) ),
      'bgp_as': (bgp.remote_as[item.network] | default(''))
      }]
      }}"
  loop: "{{ interfaces }}"
  when: item.vdom is defined and item.vdom != 'root'



