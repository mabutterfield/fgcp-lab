- name: Configure BGP
  fortinet.fortios.fortios_router_bgp:
    vdom: "{{ item.name }}"
    router_bgp:
      as: "{{ bgp.local_as }}"
      router_id: "{{ networks['loopback'] | ansible.utils.ipmath( fgsp_index ) }}"
      ebgp_multipath: "{{ bgp.ebgp_multipath | default('enable') }}"
      neighbor:
        - ip: 10.10.10.254
          soft_reconfiguration: "{{ bgp.soft_reconfiguration | default('enable') }}"
          remote_as: "{{ bgp.remote_as.dc_lan }}"
          next_hop_self: "{{ bgp.next_hop_self | default('enable') }}"
          bfd: "{{ bgp.bfd | default('enable') }}"
        - ip: 10.10.20.254
          soft_reconfiguration: "{{ bgp.soft_reconfiguration | default('enable') }}"
          remote_as: "{{ bgp.remote_as.prem_lan }}"
          next_hop_self: "{{ bgp.next_hop_self | default('enable') }}"
          bfd: "{{ bgp.bfd | default('enable') }}"

  loop: "{{ vdoms }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.name is defined
    - item.name != 'root'
